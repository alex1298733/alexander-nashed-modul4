<meta name="description" content="Boka ett rum på Alexander Hotel.">
<title>Boka – Alexander Hotel</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div class="header-inner">
<p class="logo">Alexander Hotel</p>
<nav aria-label="Huvudmeny"><ul><li><a class="" href="index.html">Start</a></li><li><a class="active" href="boka.html">Boka</a></li><li><a class="" href="hitta.html">Hitta</a></li><li><a class="" href="kontakta.html">Kontakta</a></li></ul></nav>
</div></header>
<main>
<h1>Boka ditt rum</h1><p>Fyll i formuläret för att skicka en bokningsförfrågan.</p>
<div class="form-layout">
<form action="#" method="post">
<label for="name">Namn</label><input id="name" name="name" type="text" required>
<label for="email">E-post</label><input id="email" name="email" type="email" required>
<label for="arrival">Incheckning</label><input id="arrival" name="arrival" type="date" required>
<label for="departure">Utcheckning</label><input id="departure" name="departure" type="date" required>
<label for="room">Rumstyp</label><select id="room" name="room"><option>Dubbelrum</option><option>Svit</option><option>Enkelrum</option></select>
<button type="submit">Skicka bokning</button>
</form>
<div class="info-box"><img class="hero-image" src="img/rum.webp" alt="Hotellrum på Alexander Hotel"><h2>Bo bekvämt</h2><p>Välj den rumstyp som passar din vistelse bäst.</p></div>
</div>
</main>
<footer><div class="footer-inner">
<p><strong>Alexander Hotel</strong></p>
<p>Storgatan 10, 111 22 Stockholm</p>
<p>Telefon: 08-123 45 67 · info@alexanderhotel.se</p>
</div></footer>
</body></html>
